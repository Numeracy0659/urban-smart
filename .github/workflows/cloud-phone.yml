
# ═══════════════════════════════════════════════════════════════════════════════
# Cloud Android Phone v9.1 — IMMERSIVE RESEARCH ENVIRONMENT
# ═══════════════════════════════════════════════════════════════════════════════
name: Cloud Android Phone v9.1 (Immersive & Hardened)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action'
        required: true
        default: 'start'
        type: choice
        options:
          - start
          - stop
      resolution:
        description: 'Screen Resolution (e.g., 1080x1920)'
        required: false
        default: '1080x1920'
      ram_mb:
        description: 'RAM (MB)'
        required: false
        default: '4096'

jobs:
  start-phone:
    name: Start Cloud Phone
    if: github.event.inputs.action == 'start'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          echo "✅ KVM enabled"

      - name: Start Android Emulator
        run: |
          docker run -d \
            --name dockerify-android \
            --privileged \
            --device /dev/kvm \
            -p 5555:5555 \
            -e DNS=8.8.8.8 \
            -e RAM_SIZE=${{ github.event.inputs.ram_mb }} \
            -e "SCREEN_RESOLUTION=${{ github.event.inputs.resolution }}" \
            -e SCREEN_DENSITY=420 \
            -e ROOT_SETUP=true \
            -e ARM_TRANSLATION=true \
            shmayro/dockerify-android:latest
          echo "✅ Android emulator container started"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y adb nodejs npm curl wget unzip
          sudo npm install -g nport
          echo "✅ Dependencies installed"

      - name: Setup ws-scrcpy with Immersive UI Fix
        run: |
          git clone https://github.com/NetrisTV/ws-scrcpy.git
          cd ws-scrcpy
          npm install
          # Inject CSS to hide control panel for immersive experience
          mkdir -p src/server/public/css
          echo ".side-menu { display: none !important; } .app-bar { display: none !important; } body { background: black !important; }" >> src/server/public/css/immersive.css
          # Note: We'll use the fullscreen URL parameter which is cleaner, but this is a backup.
          echo "✅ ws-scrcpy setup with immersive UI hooks"

      - name: Generate ws-scrcpy Configuration
        run: |
          cat <<EOF > ws-scrcpy/config.yaml
          runGoogTracker: true
          runApplTracker: false
          server:
            - secure: false
              port: 8000
          scrcpy:
            port: 8080
            maxSize: 1920
            bitRate: 8000000
            maxFps: 30
            encoderName: "OMX.google.h264.encoder"
            tunnelForward: true
            audio: false
            control: true
            cleanup: true
            rawStream: true
          EOF
          echo "✅ ws-scrcpy configuration generated"

      - name: Wait for Stable Android Boot
        run: |
          MAX_WAIT=600
          echo "Waiting for stable ADB connection..."
          for i in $(seq 1 ${MAX_WAIT}); do
            adb connect localhost:5555 > /dev/null 2>&1 || true
            STATE=$(adb -s localhost:5555 get-state 2>/dev/null || echo "offline")
            if [ "$STATE" = "device" ]; then
              BOOT=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null || echo "0")
              if [ "$BOOT" = "1" ]; then
                echo "✅ Device is online and boot completed"
                break
              fi
            fi
            echo "Waiting... ($i)"
            sleep 5
            if [ $i -eq $MAX_WAIT ]; then echo "❌ Timeout"; exit 1; fi
          done

      - name: Configure Network and Environment
        run: |
          # 1. Force DNS and Internet Access
          adb -s localhost:5555 shell "su -c 'setprop net.dns1 8.8.8.8'"
          adb -s localhost:5555 shell "su -c 'setprop net.dns2 8.8.4.4'"
          adb -s localhost:5555 shell "su -c 'settings put global captive_portal_mode 0'"
          adb -s localhost:5555 shell "su -c 'settings put global airplane_mode_on 0'"
          
          # 2. Verify Internet
          echo "Verifying internet connectivity..."
          adb -s localhost:5555 shell "ping -c 3 8.8.8.8" || echo "⚠️ Ping failed, but continuing..."

          # 3. Verify ARM Translation
          echo "Verifying ARM Translation..."
          ABI_LIST=$(adb -s localhost:5555 shell getprop ro.product.cpu.abilist)
          echo "Supported ABIs: $ABI_LIST"
          if [[ $ABI_LIST == *"arm64-v8a"* ]]; then
            echo "✅ ARM Translation is active"
          else
            echo "⚠️ ARM Translation might not be active. Attempting manual trigger..."
            adb -s localhost:5555 shell "su -c 'setprop ro.product.cpu.abilist x86_64,x86,arm64-v8a,armeabi-v7a,armeabi'"
          fi

          # 4. Immersive Settings
          adb -s localhost:5555 shell settings put system screen_off_timeout 2147483647
          adb -s localhost:5555 shell wm dismiss-keyguard
          adb -s localhost:5555 shell input keyevent KEYCODE_WAKEUP
          echo "✅ Configuration completed"

      - name: Install Research Arsenal
        continue-on-error: true
        run: |
          install_apk() {
            local apk_url="$1"
            wget -q -O /tmp/temp.apk "$apk_url" && adb -s localhost:5555 install -r /tmp/temp.apk && echo "✅ Installed $(basename $apk_url)" || echo "❌ Failed $(basename $apk_url)"
          }
          # Essential Tools
          install_apk "https://github.com/termux/termux-app/releases/download/v0.118.3/termux-app_v0.118.3+github-debug_universal.apk"
          install_apk "https://f-droid.org/repo/org.fdroid.fdroid_1180050.apk"
          install_apk "https://www.mt2.cn/download/mt-manager-latest.apk"
          # User's Custom App (Zapero)
          install_apk "https://files.manuscdn.com/user_upload_by_module/session_file/310519663864542854/vOOWCyFUtFfjYxNW.apk"
          
          # Deploy Frida
          FRIDA_VERSION="16.1.3"
          wget -q -O frida.xz "https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-server-${FRIDA_VERSION}-android-x86_64.xz"
          unxz frida.xz && chmod +x frida && adb -s localhost:5555 push frida /data/local/tmp/frida-server
          adb -s localhost:5555 shell "su -c 'chmod 755 /data/local/tmp/frida-server && /data/local/tmp/frida-server &'" > /dev/null 2>&1
          echo "✅ Apps and Frida deployed"

      - name: Start ws-scrcpy
        run: |
          cd ws-scrcpy
          WS_SCRCPY_CONFIG=$(pwd)/config.yaml npm start > ws-scrcpy.log 2>&1 &
          sleep 20

      - name: Start nport Tunnel
        id: tunnel
        run: |
          nport 8000 --language en > tunnel.log 2>&1 &
          sleep 20
          TUNNEL_URL=$(grep -o 'https://[-a-z0-9.]*.nport.link' tunnel.log | head -n 1)
          # Provide the direct stream URL for immersive experience
          echo "url=${TUNNEL_URL}/#!action=stream&udid=localhost%3A5555&player=mse&ws=wss%3A%2F%2F$(echo $TUNNEL_URL | sed 's/https:\/\///')%2F%3Faction%3Dproxy-adb%26remote%3Dtcp%253A8886%26udid%3Dlocalhost%253A5555" >> $GITHUB_OUTPUT
          echo "✅ nport tunnel created"

      - name: Final Access Info
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║          CLOUD ANDROID PHONE v9.1 (IMMERSIVE)              ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  ACCESS URL: ${{ steps.tunnel.outputs.url }}               ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo "${{ steps.tunnel.outputs.url }}" > access_url.txt

      - name: Keep Session Alive
        run: |
          END_TIME=$(( $(date +%s) + 6 * 3600 ))
          while [ $(date +%s) -lt $END_TIME ]; do
            adb connect localhost:5555 > /dev/null 2>&1 || true
            sleep 300
          done
