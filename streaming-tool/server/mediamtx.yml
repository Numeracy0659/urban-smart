# MediaMTX configuration
paths:
  mystream:
    source: publisher

# Enable WebRTC
webrtc: yes
webrtcAddress: :8889
webrtcICEUDP: yes
webrtcICETCP: yes
# We don't set external IPs because they are dynamic via the tunnel

# Enable RTSP for scrcpy/ffmpeg input
rtsp: yes
rtspAddress: :8554

# Disable other protocols to save resources
hls: no
rtmp: no
srt: no
