# MediaMTX configuration
paths:
  mystream:
    source: publisher

# Enable WebRTC
webrtc: yes
webrtcAddress: :8889
webrtcICEUDP: no
# webrtcICETCP: yes (Unknown in some versions)
webrtcLocalTCPAddress: :8889

# Enable RTSP for scrcpy/ffmpeg input
rtsp: yes
rtspAddress: :8554

# Disable other protocols to save resources
hls: no
rtmp: no
srt: no

# Logging
logLevel: info
