
# ═══════════════════════════════════════════════════════════════════════════════
# Cloud Android Phone v7.1 — PROFESSIONAL HARDENING (HD, Root, Frida)
# ═══════════════════════════════════════════════════════════════════════════════
name: Cloud Android Phone v7.1 (Professional Hardening)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action'
        required: true
        default: 'start'
        type: choice
        options:
          - start
          - stop
      resolution:
        description: 'Screen Resolution (e.g., 1080x1920)'
        required: false
        default: '1080x1920' # Increased default resolution
      ram_mb:
        description: 'RAM (MB)'
        required: false
        default: '4096'
      enable_root:
        description: 'Enable Root (Magisk)'
        required: false
        default: true # Default to true for professional use
        type: boolean
      enable_gapps:
        description: 'Enable Google Apps (PICO)'
        required: false
        default: false
        type: boolean
      enable_arm:
        description: 'Enable ARM Translation'
        required: false
        default: true
        type: boolean
      session_hours:
        description: 'Max Session Duration (hours)'
        required: false
        default: '6'

permissions:
  contents: read

jobs:
  start-phone:
    name: Start Cloud Phone
    if: github.event.inputs.action == 'start'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          echo "✅ KVM enabled"

      - name: Start Android Emulator
        run: |
          docker run -d \
            --name dockerify-android \
            --privileged \
            --device /dev/kvm \
            -p 5555:5555 \
            -e DNS=1.1.1.1 \
            -e RAM_SIZE=${{ github.event.inputs.ram_mb }} \
            -e "SCREEN_RESOLUTION=${{ github.event.inputs.resolution }}" \
            -e SCREEN_DENSITY=420 \ # Added screen density for clarity
            -e ROOT_SETUP=$(echo "${{ github.event.inputs.enable_root }}" | tr '[:upper:]' '[:lower:]') \
            -e GAPPS_SETUP=$(echo "${{ github.event.inputs.enable_gapps }}" | tr '[:upper:]' '[:lower:]') \
            -e ARM_TRANSLATION=$(echo "${{ github.event.inputs.enable_arm }}" | tr '[:upper:]' '[:lower:]') \
            shmayro/dockerify-android:latest # Sticking with latest for now, as it supports root and ARM
          echo "✅ Android emulator container started"

      - name: Install ws-scrcpy Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y adb nodejs npm curl wget unzip
          sudo npm install -g nport
          echo "✅ Dependencies installed"

      - name: Clone and Install ws-scrcpy
        run: |
          git clone https://github.com/NetrisTV/ws-scrcpy.git
          cd ws-scrcpy
          npm install
          echo "✅ ws-scrcpy installed"

      - name: Generate ws-scrcpy Configuration
        run: |
          cat <<EOF > ws-scrcpy/config.yaml
          runGoogTracker: true
          runApplTracker: false
          server:
            - secure: false
              port: 8000
          scrcpy:
            port: 8080
            maxSize: ${{ github.event.inputs.resolution }} # Use workflow input for resolution
            bitRate: 8000000 # Increased bitrate to 8Mbps for clarity
            maxFps: 30 # Increased FPS for smoother experience
            encoderName: "OMX.google.h264.encoder"
            tunnelForward: true
            audio: false
            control: true
            cleanup: true
            rawStream: true
          EOF
          echo "✅ ws-scrcpy configuration generated"

      - name: Wait for Android Boot and Configure
        run: |
          MAX_WAIT=900
          echo "Waiting for Android to boot..."
          adb connect localhost:5555 || true
          for i in $(seq 1 ${MAX_WAIT}); do
            if ! adb devices | grep -q "localhost:5555.*device"; then
              adb connect localhost:5555 > /dev/null 2>&1 || true
            fi
            BOOT=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null || echo "0")
            if [ "${BOOT}" = "1" ]; then
              echo "✅ Android boot completed after $((i*2))s"
              # Ensure screen is awake and unlocked
              adb -s localhost:5555 shell settings put system screen_off_timeout 2147483647
              adb -s localhost:5555 shell wm dismiss-keyguard
              adb -s localhost:5555 shell input keyevent KEYCODE_WAKEUP
              # Verify root access
              if ${{ github.event.inputs.enable_root }}; then
                adb -s localhost:5555 shell "su -c 'id'" && echo "✅ Root access verified" || echo "❌ Root access NOT verified"
              fi
              exit 0
            fi
            if [ $((i % 30)) -eq 0 ]; then
              echo "  ... still booting ($((i*2))s) ..."
            fi
            sleep 2
          done
          echo "❌ Boot timed out!"
          exit 1

      - name: Deploy and Start Frida Server
        if: github.event.inputs.enable_root == true # Only deploy if root is enabled
        run: |
          FRIDA_VERSION="16.1.3" # Use a recent stable Frida version
          FRIDA_SERVER_URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-server-${FRIDA_VERSION}-android-x86_64.xz"
          echo "Downloading Frida server from ${FRIDA_SERVER_URL}"
          wget -q -O frida-server.xz ${FRIDA_SERVER_URL}
          unxz frida-server.xz
          chmod +x frida-server
          adb -s localhost:5555 push frida-server /data/local/tmp/frida-server
          adb -s localhost:5555 shell "chmod 755 /data/local/tmp/frida-server"
          adb -s localhost:5555 shell "/data/local/tmp/frida-server &" > /dev/null 2>&1
          echo "✅ Frida server deployed and started"

      - name: Start ws-scrcpy
        run: |
          cd ws-scrcpy
          WS_SCRCPY_CONFIG=$(pwd)/config.yaml npm start > ws-scrcpy.log 2>&1 &
          echo "✅ ws-scrcpy started in background"
          sleep 30

      - name: Start nport Tunnel
        id: tunnel
        run: |
          nport 8000 --language en > tunnel.log 2>&1 &
          sleep 30
          TUNNEL_URL=$(grep -o 'https://[-a-z0-9.]*.nport.link' tunnel.log | head -n 1)
          echo "url=${TUNNEL_URL}" >> $GITHUB_OUTPUT
          echo "✅ nport tunnel created: ${TUNNEL_URL}"

      - name: Print Access Information
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║          CLOUD ANDROID PHONE v7.1 (HARDENED)               ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  URL: ${{ steps.tunnel.outputs.url }}                     ║"
          echo "║  Status: HD Stream, Root, Frida-Ready                     ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo "${{ steps.tunnel.outputs.url }}" > access_url.txt
          find . -name "*.log" -exec cp {} . \; || true

      - name: Upload Debug Logs & URL
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs-and-url
          path: |
            access_url.txt
            *.log
            ws-scrcpy/ws-scrcpy.log # Include ws-scrcpy logs
          retention-days: 1

      - name: Install Apps via ADB
        continue-on-error: true
        run: |
          echo "Installing apps..."
          install_apk() {
            local apk_url="$1"
            local app_name="$(basename "$apk_url")"
            local max_retries=5
            local delay_seconds=10
            for attempt in $(seq 1 $max_retries); do
              echo "Attempt $attempt to install $app_name..."
              if wget -q -O /tmp/app.apk "$apk_url" && adb -s localhost:5555 install -r /tmp/app.apk; then
                echo "✅ Successfully installed $app_name"
                return 0
              else
                echo "❌ Failed to install $app_name. Retrying in $delay_seconds seconds..."
                sleep $delay_seconds
              fi
            done
            echo "❌ Failed to install $app_name after $max_retries attempts."
            return 1
          }
          install_apk "https://github.com/termux/termux-app/releases/download/v0.118.3/termux-app_v0.118.3+github-debug_universal.apk"
          sleep 10 # Delay between installations
          install_apk "https://f-droid.org/repo/org.fdroid.fdroid_1180050.apk"
          echo "✅ App installation attempts completed"

      - name: Keep Session Alive
        run: |
          echo "Session started for ${{ github.event.inputs.session_hours }} hours"
          END_TIME=$(( $(date +%s) + ${{ github.event.inputs.session_hours }} * 3600 ))
          while [ $(date +%s) -lt $END_TIME ]; do
            echo "Session active... $(date)"
            sleep 300
          done
