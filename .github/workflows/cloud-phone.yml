
# ═══════════════════════════════════════════════════════════════════════════════
# Forensic App Lab v11.0 — SMART CLOUD RESEARCH WORKSTATION
# ═══════════════════════════════════════════════════════════════════════════════
name: Forensic App Lab v11.0 (Smart Cloud Workstation)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action'
        required: true
        default: 'start'
        type: choice
        options:
          - start
          - stop

jobs:
  start-lab:
    name: Start Forensic App Lab
    if: github.event.inputs.action == 'start'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          echo "✅ KVM enabled"

      - name: Start Android Runtime Engine
        run: |
          docker run -d \
            --name android-engine \
            --privileged \
            --device /dev/kvm \
            -p 5555:5555 \
            -e DNS=8.8.8.8 \
            -e RAM_SIZE=4096 \
            -e SCREEN_RESOLUTION=720x1280 \
            -e SCREEN_DENSITY=320 \
            -e ROOT_SETUP=true \
            -e ARM_TRANSLATION=true \
            shmayro/dockerify-android:latest
          echo "✅ Android engine container started"

      - name: Install Forensic Tools & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y adb nodejs npm curl wget unzip socat python3-pip
          sudo npm install -g nport
          
          # Install Bore for TCP Tunneling (ADB)
          wget -q https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          tar -xzf bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          sudo mv bore /usr/local/bin/
          
          # Install Mitmproxy & Frida Tools (using --break-system-packages for Ubuntu 24.04 compatibility)
          sudo pip3 install mitmproxy frida-tools objection --break-system-packages
          
          # Install Jadx for Static Analysis
          JADX_VERSION="1.5.0"
          wget -q -O jadx.zip "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"
          unzip -q jadx.zip -d jadx
          sudo ln -s $(pwd)/jadx/bin/jadx /usr/local/bin/jadx
          
          echo "✅ Forensic toolchain installed"

      - name: Wait for Android Boot & Setup Frida Server
        run: |
          MAX_WAIT=600
          echo "Waiting for Android boot..."
          for i in $(seq 1 ${MAX_WAIT}); do
            adb connect localhost:5555 > /dev/null 2>&1 || true
            BOOT=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null || echo "0")
            if [ "${BOOT}" = "1" ]; then
              echo "✅ Android boot completed"
              break
            fi
            sleep 5
          done
          
          # Deploy Frida Server
          FRIDA_VERSION="16.1.3"
          wget -q -O frida.xz "https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-server-${FRIDA_VERSION}-android-x86_64.xz"
          unxz frida.xz && chmod +x frida
          adb -s localhost:5555 push frida /data/local/tmp/frida-server
          adb -s localhost:5555 shell "su -c 'chmod 755 /data/local/tmp/frida-server && /data/local/tmp/frida-server &'" > /dev/null 2>&1
          echo "✅ Frida server deployed with root privileges"

      - name: Build Forensic Web Dashboard (App Lab)
        run: |
          mkdir -p forensic-lab
          cat << 'EOF' > forensic-lab/server.js
          const http = require('http');
          const { exec, spawn } = require('child_process');
          const fs = require('fs');

          const server = http.createServer((req, res) => {
            if (req.method === 'GET') {
              res.writeHead(200, { 'Content-Type': 'text/html' });
              res.end(`
                <html>
                  <head>
                    <title>Forensic App Lab v11.0</title>
                    <style>
                      body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 30px; background: #0a0a0a; color: #e0e0e0; margin: 0; }
                      .container { max-width: 1000px; margin: 0 auto; }
                      h1 { color: #00ffcc; border-bottom: 2px solid #222; padding-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
                      .badge { background: #00ffcc22; color: #00ffcc; padding: 5px 10px; border-radius: 4px; font-size: 12px; font-family: monospace; }
                      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
                      .card { background: #161616; padding: 25px; border-radius: 10px; border: 1px solid #2a2a2a; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
                      h3 { margin-top: 0; color: #00ffcc; }
                      input[type="text"] { width: calc(100% - 22px); padding: 12px; border-radius: 6px; border: 1px solid #333; background: #222; color: #fff; margin-bottom: 15px; font-size: 14px; }
                      button { padding: 12px 25px; background: #00ffcc; color: #000; border: none; cursor: pointer; border-radius: 6px; font-weight: bold; transition: background 0.3s; }
                      button:hover { background: #00ccaa; }
                      code { background: #000; padding: 12px; display: block; border-radius: 6px; color: #00ff00; font-family: 'Courier New', Courier, monospace; overflow-x: auto; margin-top: 10px; }
                      .status-list { list-style: none; padding: 0; }
                      .status-list li { margin-bottom: 10px; padding-left: 20px; position: relative; }
                      .status-list li::before { content: '▶'; position: absolute; left: 0; color: #00ffcc; font-size: 10px; }
                    </style>
                  </head>
                  <body>
                    <div class="container">
                      <h1>
                        🔬 Forensic App Lab Workstation
                        <span class="badge">v11.0 SECURE LAB</span>
                      </h1>
                      <p>Cloud-native mobile application analysis platform with integrated ADB terminal and runtime hooking.</p>
                      
                      <div class="grid">
                        <div class="card">
                          <h3>📥 Target APK Importer</h3>
                          <p>Import any target APK into the runtime environment for inspection.</p>
                          <form action="/upload" method="POST">
                            <input type="text" name="apk_url" placeholder="https://example.com/target-app.apk" required />
                            <button type="submit">Deploy to Lab</button>
                          </form>
                        </div>

                        <div class="card">
                          <h3>🛠️ Active Toolchain</h3>
                          <ul class="status-list">
                            <li><b>Frida Engine:</b> <code>port 27042 (Rooted)</code></li>
                            <li><b>Mitmproxy:</b> <code>port 8081 (Active)</code></li>
                            <li><b>Jadx Decompiler:</b> <code>CLI Ready</code></li>
                            <li><b>Runtime Sandbox:</b> <code>Isolated Micro-Container</code></li>
                          </ul>
                        </div>
                      </div>

                      <div class="card" style="margin-top: 20px;">
                        <h3>💻 Terminal Link (Local Control)</h3>
                        <p>Link your local terminal directly to this forensic workstation:</p>
                        <code id="adb-command">Loading connection string...</code>
                      </div>
                    </div>
                    <script>
                      fetch('/adb-info').then(r => r.json()).then(data => {
                        document.getElementById('adb-command').innerText = 'adb connect ' + data.host;
                      });
                    </script>
                  </body>
                </html>
              `);
            } else if (req.method === 'GET' && req.url === '/adb-info') {
              const adbHost = fs.readFileSync('../adb_host.txt', 'utf8').trim();
              res.writeHead(200, { 'Content-Type': 'application/json' });
              res.end(JSON.stringify({ host: adbHost }));
            } else if (req.method === 'POST' && req.url === '/upload') {
              let body = '';
              req.on('data', chunk => { body += chunk; });
              req.on('end', () => {
                const url = new URLSearchParams(body).get('apk_url');
                exec(`wget -q -O /tmp/target.apk "${url}" && adb -s localhost:5555 install -r /tmp/target.apk`, (err, stdout, stderr) => {
                  res.writeHead(200, { 'Content-Type': 'text/html' });
                  if (err) {
                    res.end(`<body style="background:#0a0a0a; color:#fff; padding:40px; font-family:sans-serif;"><h3>❌ Deployment Failed</h3><pre style="color:#ff5555;">${stderr}</pre><br><a href="/" style="color:#00ffcc;">Back to Lab</a></body>`);
                  } else {
                    res.end(`<body style="background:#0a0a0a; color:#fff; padding:40px; font-family:sans-serif;"><h3>✅ Target Deployed Successfully</h3><pre style="color:#55ff55;">${stdout}</pre><br><a href="/" style="color:#00ffcc;">Back to Lab</a></body>`);
                  }
                });
              });
            }
          });
          server.listen(8080, () => console.log('Forensic Lab Dashboard running on port 8080'));
          EOF
          
          cd forensic-lab && node server.js > server.log 2>&1 &
          echo "✅ Forensic dashboard online"

      - name: Start Secure Access Tunnels
        id: tunnels
        run: |
          # Start Bore TCP Tunnel for ADB (5555)
          bore local 5555 --to bore.pub > bore.log 2>&1 &
          sleep 15
          ADB_HOST=$(grep -o 'bore.pub:[0-9]*' bore.log | head -n 1)
          echo "$ADB_HOST" > adb_host.txt
          
          # Start nport for Forensic Dashboard (8080)
          nport 8080 --language en > portal_tunnel.log 2>&1 &
          sleep 15
          PORTAL_URL=$(grep -o 'https://[-a-z0-9.]*.nport.link' portal_tunnel.log | head -n 1)
          
          echo "portal_url=$PORTAL_URL" >> $GITHUB_OUTPUT
          echo "adb_host=$ADB_HOST" >> $GITHUB_OUTPUT
          
          echo "✅ Secure tunnels established"

      - name: Print Handover Banner
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║          FORENSIC APP LAB v11.0 READY                        ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  1. Forensic Dashboard: ${{ steps.tunnels.outputs.portal_url }} ║"
          echo "║  2. Terminal ADB Link: adb connect ${{ steps.tunnels.outputs.adb_host }} ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo "${{ steps.tunnels.outputs.portal_url }}" > portal_url.txt
          echo "${{ steps.tunnels.outputs.adb_host }}" > adb_host.txt

      - name: Maintain Session Watchdog
        run: |
          END_TIME=$(( $(date +%s) + 6 * 3600 ))
          while [ $(date +%s) -lt $END_TIME ]; do
            adb connect localhost:5555 > /dev/null 2>&1 || true
            sleep 300
          done
