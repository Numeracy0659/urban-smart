# MediaMTX configuration (v1.9.0 compatible)
paths:
  mystream:
    source: publisher

# Enable WebRTC
webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
webrtcLocalUDPAddress: '' # Disable UDP to force TCP
webrtcLocalTCPAddress: :8889
webrtcIPsFromInterfaces: yes
webrtcAdditionalHosts: []

# Enable RTSP for scrcpy/ffmpeg input
rtsp: yes
rtspAddress: :8554
protocols: [tcp]

# Enable HLS as a fallback
hls: yes
hlsAddress: :8888
hlsVariant: lowLatency

# Disable other protocols
rtmp: no
srt: no

# Logging
logLevel: info
