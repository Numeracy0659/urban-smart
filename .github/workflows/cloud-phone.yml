
# ═══════════════════════════════════════════════════════════════════════════════
# Cloud Android Phone v10.0 — SMART RESEARCH BRIDGE (Terminal + Web Importer)
# ═══════════════════════════════════════════════════════════════════════════════
name: Cloud Android Phone v10.0 (Smart Research Bridge)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action'
        required: true
        default: 'start'
        type: choice
        options:
          - start
          - stop
      resolution:
        description: 'Screen Resolution'
        required: false
        default: '720x1280'
      ram_mb:
        description: 'RAM (MB)'
        required: false
        default: '4096'

jobs:
  start-bridge:
    name: Start Smart Research Bridge
    if: github.event.inputs.action == 'start'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          echo "✅ KVM enabled"

      - name: Start Android Emulator Container
        run: |
          docker run -d \
            --name dockerify-android \
            --privileged \
            --device /dev/kvm \
            -p 5555:5555 \
            -e DNS=8.8.8.8 \
            -e RAM_SIZE=${{ github.event.inputs.ram_mb }} \
            -e "SCREEN_RESOLUTION=${{ github.event.inputs.resolution }}" \
            -e SCREEN_DENSITY=320 \
            -e ROOT_SETUP=true \
            -e ARM_TRANSLATION=true \
            shmayro/dockerify-android:latest
          echo "✅ Android container started"

      - name: Install System Dependencies & Tunneling Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y adb nodejs npm curl wget unzip socat
          sudo npm install -g nport
          # Install Bore (TCP Tunnel)
          wget -q https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          tar -xzf bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          sudo mv bore /usr/local/bin/
          echo "✅ Tools installed"

      - name: Wait for Android Boot
        run: |
          MAX_WAIT=600
          echo "Waiting for Android boot..."
          for i in $(seq 1 ${MAX_WAIT}); do
            adb connect localhost:5555 > /dev/null 2>&1 || true
            BOOT=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null || echo "0")
            if [ "${BOOT}" = "1" ]; then
              echo "✅ Android boot completed"
              break
            fi
            sleep 5
          done

      - name: Setup Headless Research Tools & Frida
        run: |
          # 1. Hardening & Network
          adb -s localhost:5555 shell "su -c 'setprop net.dns1 8.8.8.8'"
          adb -s localhost:5555 shell "su -c 'settings put global captive_portal_mode 0'"
          
          # 2. Deploy Frida Server
          FRIDA_VERSION="16.1.3"
          wget -q -O frida.xz "https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-server-${FRIDA_VERSION}-android-x86_64.xz"
          unxz frida.xz && chmod +x frida
          adb -s localhost:5555 push frida /data/local/tmp/frida-server
          adb -s localhost:5555 shell "su -c 'chmod 755 /data/local/tmp/frida-server && /data/local/tmp/frida-server &'" > /dev/null 2>&1
          
          # 3. Deploy Mitmproxy for API Interception
          sudo pip3 install mitmproxy
          mitmdump -p 8081 -w /tmp/traffic.flow > mitmproxy.log 2>&1 &
          
          # 4. Install Jadx for Reverse Engineering
          JADX_VERSION="1.5.0"
          wget -q -O jadx.zip "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"
          unzip -q jadx.zip -d jadx
          sudo ln -s $(pwd)/jadx/bin/jadx /usr/local/bin/jadx
          
          echo "✅ Advanced tools integrated"

      - name: Build Research Dashboard Portal
        run: |
          mkdir -p web-portal
          cat << 'EOF' > web-portal/server.js
          const http = require('http');
          const { exec } = require('child_process');
          const fs = require('fs');

          const server = http.createServer((req, res) => {
            if (req.method === 'GET') {
              res.writeHead(200, { 'Content-Type': 'text/html' });
              res.end(`
                <html>
                  <head>
                    <title>Manus Research Dashboard</title>
                    <style>
                      body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; background: #0f0f0f; color: #e0e0e0; line-height: 1.6; }
                      .container { max-width: 900px; margin: 0 auto; }
                      h1 { color: #007acc; border-bottom: 2px solid #333; padding-bottom: 10px; }
                      .card { background: #1e1e1e; padding: 25px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
                      h3 { margin-top: 0; color: #4CAF50; }
                      input[type="text"] { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #252526; color: #fff; margin-bottom: 15px; font-size: 14px; }
                      button { padding: 12px 25px; background: #0e639c; color: white; border: none; cursor: pointer; border-radius: 6px; font-weight: bold; transition: background 0.3s; }
                      button:hover { background: #1177bb; }
                      code { background: #000; padding: 12px; display: block; border-radius: 6px; color: #00ff00; font-family: 'Courier New', Courier, monospace; overflow-x: auto; }
                      .status-list { list-style: none; padding: 0; }
                      .status-list li { margin-bottom: 12px; padding-left: 25px; position: relative; }
                      .status-list li::before { content: '●'; position: absolute; left: 0; color: #4CAF50; }
                    </style>
                  </head>
                  <body>
                    <div class="container">
                      <h1>🚀 Manus Smart Research Bridge</h1>
                      
                      <div class="card">
                        <h3>📥 APK Importer</h3>
                        <p>Paste a direct URL to any APK to install it into the cloud environment.</p>
                        <form action="/upload" method="POST">
                          <input type="text" name="apk_url" placeholder="https://example.com/app.apk" required />
                          <button type="submit">Install Target App</button>
                        </form>
                      </div>

                      <div class="card">
                        <h3>🛠️ Research Toolbox</h3>
                        <ul class="status-list">
                          <li><b>Frida Server:</b> Active on <code>port 27042</code></li>
                          <li><b>Mitmproxy:</b> Capturing traffic on <code>port 8081</code></li>
                          <li><b>Jadx:</b> Ready for de-compilation via CLI</li>
                          <li><b>Root Access:</b> Verified (Magisk/SU)</li>
                        </ul>
                      </div>

                      <div class="card">
                        <h3>💻 Terminal Connection</h3>
                        <p>Copy and run this in your local terminal to link your machine:</p>
                        <code>adb connect <span id="adb-host">...</span></code>
                        <p style="font-size: 12px; color: #888; margin-top: 10px;">Note: You must have ADB installed locally.</p>
                      </div>
                    </div>
                    <script>
                      // We will inject the ADB host here
                      fetch('/adb-info').then(r => r.json()).then(data => {
                        document.getElementById('adb-host').innerText = data.host;
                      });
                    </script>
                  </body>
                </html>
              `);
            } else if (req.method === 'GET' && req.url === '/adb-info') {
              const adbHost = fs.readFileSync('../adb_host.txt', 'utf8').trim();
              res.writeHead(200, { 'Content-Type': 'application/json' });
              res.end(JSON.stringify({ host: adbHost }));
            } else if (req.method === 'POST' && req.url === '/upload') {
              let body = '';
              req.on('data', chunk => { body += chunk; });
              req.on('end', () => {
                const url = new URLSearchParams(body).get('apk_url');
                exec(`wget -q -O /tmp/target.apk "${url}" && adb -s localhost:5555 install -r /tmp/target.apk`, (err, stdout, stderr) => {
                  res.writeHead(200, { 'Content-Type': 'text/html' });
                  if (err) {
                    res.end(`<h3>❌ Installation Failed</h3><pre>${stderr}</pre><br><a href="/">Back</a>`);
                  } else {
                    res.end(`<h3>✅ Installation Success!</h3><pre>${stdout}</pre><br><a href="/">Back</a>`);
                  }
                });
              });
            }
          });
          server.listen(8080, () => console.log('Portal running on port 8080'));
          EOF
          
          cd web-portal && node server.js > server.log 2>&1 &
          echo "✅ Dashboard started"

      - name: Start Secure Tunnels (ADB TCP + Web Dashboard)
        id: tunnels
        run: |
          # 1. Start Bore TCP Tunnel for ADB (5555)
          bore local 5555 --to bore.pub > bore.log 2>&1 &
          sleep 15
          ADB_HOST=$(grep -o 'bore.pub:[0-9]*' bore.log | head -n 1)
          echo "$ADB_HOST" > adb_host.txt
          echo "adb_host=$ADB_HOST" >> $GITHUB_OUTPUT
          
          # 2. Start nport for Web Dashboard (8080)
          nport 8080 --language en > portal_tunnel.log 2>&1 &
          sleep 15
          PORTAL_URL=$(grep -o 'https://[-a-z0-9.]*.nport.link' portal_tunnel.log | head -n 1)
          echo "portal_url=$PORTAL_URL" >> $GITHUB_OUTPUT
          
          echo "✅ Tunnels live"

      - name: Final Handover Info
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║          SMART RESEARCH BRIDGE v10.0 READY                   ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  1. Research Dashboard: ${{ steps.tunnels.outputs.portal_url }} ║"
          echo "║  2. Local Terminal Link: adb connect ${{ steps.tunnels.outputs.adb_host }} ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo "${{ steps.tunnels.outputs.portal_url }}" > portal_url.txt
          echo "${{ steps.tunnels.outputs.adb_host }}" > adb_host.txt

      - name: Keep Session Alive
        run: |
          END_TIME=$(( $(date +%s) + 6 * 3600 ))
          while [ $(date +%s) -lt $END_TIME ]; do
            adb connect localhost:5555 > /dev/null 2>&1 || true
            sleep 300
          done
