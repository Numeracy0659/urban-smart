# MediaMTX configuration
paths:
  mystream:
    source: publisher

# Enable WebRTC
webrtc: yes
webrtcAddress: :8889
webrtcICEUDP: no
webrtcICETCP: yes
# The external IP will be set dynamically by the supervisor or start script
# webrtcExternalIP: [TUNNEL_URL]

# Enable RTSP for scrcpy/ffmpeg input
rtsp: yes
rtspAddress: :8554
rtspTransport: tcp

# Disable other protocols to save resources
hls: no
rtmp: no
srt: no
