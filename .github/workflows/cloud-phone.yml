name: Cloud Android Phone
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action'
        required: true
        default: 'start'
        type: choice
        options:
          - start
          - stop
      resolution:
        description: 'Screen Resolution'
        required: false
        default: '720x1280'
      ram_mb:
        description: 'RAM (MB)'
        required: false
        default: '4096'
      enable_root:
        description: 'Enable Root (Magisk) — takes 10-15min extra boot time'
        required: false
        default: true
        type: boolean
      enable_gapps:
        description: 'Enable Google Apps (PICO) — takes 10-15min extra boot time'
        required: false
        default: false
        type: boolean
      enable_arm:
        description: 'Enable ARM Translation'
        required: false
        default: true
        type: boolean
      android_version:
        description: 'Android Version (11, 12, 13, 14)'
        required: false
        default: '11'
      session_hours:
        description: 'Max Session Duration (hours)'
        required: false
        default: '6'
permissions:
  contents: read

jobs:
  start-phone:
    name: Start Cloud Phone
    if: github.event.inputs.action == 'start'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      # ────────────────────────────────────────────
      # PHASE 1: CORE INFRASTRUCTURE (PROVEN WORKING)
      # ────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm
          echo "KVM enabled"
          ls -la /dev/kvm

      - name: Pull Docker Images
        run: |
          docker pull shmayro/dockerify-android:latest
          docker pull shmayro/scrcpy-web:latest
          echo "Docker images ready"

      - name: Start Android Emulator
        run: |
          docker run -d \
            --name dockerify-android \
            --privileged \
            --device /dev/kvm \
            -p 5555:5555 \
            -e DNS=one.one.one.one \
            -e RAM_SIZE=${{ github.event.inputs.ram_mb }} \
            -e "SCREEN_RESOLUTION=${{ github.event.inputs.resolution }}" \
            -e ROOT_SETUP=$(echo "${{ github.event.inputs.enable_root }}" | tr '[:upper:]' '[:lower:]') \
            -e GAPPS_SETUP=$(echo "${{ github.event.inputs.enable_gapps }}" | tr '[:upper:]' '[:lower:]') \
            -e ARM_TRANSLATION=$(echo "${{ github.event.inputs.enable_arm }}" | tr '[:upper:]' '[:lower:]') \
            -e ANDROID_VERSION=${{ github.event.inputs.android_version }} \
            shmayro/dockerify-android:latest
          echo "Android emulator starting..."

      - name: Start scrcpy-web
        run: |
          echo "Waiting 30s for emulator to initialize..."
          sleep 30
          docker run -d \
            --name scrcpy-web \
            --privileged \
            -p 8000:8000 \
            --link dockerify-android \
            shmayro/scrcpy-web:latest sh -c \
            "adb connect dockerify-android:5555 && npm start"
          echo "scrcpy-web container started on port 8000"

      - name: Wait for Android Boot
        run: |
          echo "Waiting for Android ${{ github.event.inputs.android_version }} to boot (first boot may take 10+ mins)..."
          BOOT="0"
          for i in $(seq 1 1200); do
            BOOT=$(docker exec dockerify-android adb -s emulator-5555 shell getprop sys.boot_completed 2>/dev/null || echo "0")
            if [ "${BOOT}" = "1" ]; then
              echo "Android boot completed after ${i}s"
              break
            fi
            if [ $((i % 60)) -eq 0 ]; then
              echo " ... booting (${i}s) — checking status..."
              docker exec dockerify-android adb devices 2>/dev/null || true
              docker logs --since 60s dockerify-android 2>&1 | grep -E "Broadcast completed|Success !!" || true
            fi
            sleep 1
          done
          if [ "${BOOT}" != "1" ]; then
            echo "::warning::Android boot didn't fully complete in 20 minutes. Checking Docker logs..."
            docker logs --tail 50 dockerify-android
          else
            echo "Boot fully successful!"
          fi

      - name: Optimize Android
        run: |
          echo "Disabling animations for smoother experience..."
          docker exec dockerify-android adb shell settings put global window_animation_scale 0 2>/dev/null || true
          docker exec dockerify-android adb shell settings put global transition_animation_scale 0 2>/dev/null || true
          docker exec dockerify-android adb shell settings put global animator_duration_scale 0 2>/dev/null || true
          docker exec dockerify-android adb shell settings put system screen_off_timeout 2147483647 2>/dev/null || true
          docker exec dockerify-android adb shell settings put secure show_ime_with_hard_keyboard 1 2>/dev/null || true
          echo "Optimizations applied"

      - name: Wait for scrcpy-web
        run: |
          echo "Waiting for scrcpy-web to be ready..."
          for i in $(seq 1 120); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000 2>/dev/null || echo "000")
            if [ "${HTTP_CODE}" != "000" ] && [ "${HTTP_CODE}" != "502" ] && [ "${HTTP_CODE}" != "503" ]; then
              echo "scrcpy-web ready (HTTP ${HTTP_CODE})"
              exit 0
            fi
            sleep 3
          done
          echo "::warning::scrcpy-web may not be fully ready, continuing anyway..."

      - name: Create Public Tunnel
        id: expose
        uses: codetalkio/expose-tunnel@v1.5.0
        with:
          service: bore.pub
          port: 8000

      - name: Print Access Information
        run: |
          echo ""
          echo "=========================================="
          echo " CLOUD ANDROID PHONE IS READY!"
          echo "=========================================="
          echo ""
          echo " URL: ${{ steps.expose.outputs.tunnel-url }}"
          echo " Android: API 34 (Android 14)"
          echo " Resolution: ${{ github.event.inputs.resolution }}"
          echo " RAM: ${{ github.event.inputs.ram_mb }}MB"
          echo " Root: ${{ github.event.inputs.enable_root }}"
          echo " GAPPS: ${{ github.event.inputs.enable_gapps }}"
          echo " Session: ${{ github.event.inputs.session_hours }} hours max"
          echo ""
          echo " Open the URL in your browser to use your phone!"
          echo "=========================================="

      - name: Save Access URL as Artifact
        run: |
          mkdir -p /tmp/access-info
          echo "${{ steps.expose.outputs.tunnel-url }}" > /tmp/access-info/url.txt
          echo "" >> /tmp/access-info/url.txt
          echo "Android: API 34 (Android 14)" >> /tmp/access-info/url.txt
          echo "Resolution: ${{ github.event.inputs.resolution }}" >> /tmp/access-info/url.txt
          echo "RAM: ${{ github.event.inputs.ram_mb }}MB" >> /tmp/access-info/url.txt
          echo "Root: ${{ github.event.inputs.enable_root }}" >> /tmp/access-info/url.txt
          echo "GAPPS: ${{ github.event.inputs.enable_gapps }}" >> /tmp/access-info/url.txt
          echo "Session: ${{ github.event.inputs.session_hours }}h max" >> /tmp/access-info/url.txt
          echo "" >> /tmp/access-info/url.txt
          echo "Open the URL above in your browser to use your Cloud Android Phone!" >> /tmp/access-info/url.txt
          cat /tmp/access-info/url.txt

      - name: Upload Access URL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloud-phone-access-url
          path: /tmp/access-info/
          retention-days: 1

      # ────────────────────────────────────────────
      # PHASE 2: ROOT VERIFICATION & SYSTEM INFO
      # ────────────────────────────────────────────
      - name: Verify Root Access & System Info
        run: |
          echo "=== ROOT VERIFICATION ==="
          # Check su binary
          docker exec dockerify-android adb -s emulator-5555 shell su -c id 2>/dev/null || \
            docker exec dockerify-android adb -s emulator-5555 shell "id"
          echo ""
          echo "=== SYSTEM INFO ==="
          docker exec dockerify-android adb -s emulator-5555 shell getprop ro.build.version.release
          docker exec dockerify-android adb -s emulator-5555 shell getprop ro.product.model
          docker exec dockerify-android adb -s emulator-5555 shell getprop ro.product.cpu.abi
          echo ""
          echo "=== MEMORY ==="
          docker exec dockerify-android adb -s emulator-5555 shell cat /proc/meminfo | head -5
          echo ""
          echo "=== STORAGE ==="
          docker exec dockerify-android adb -s emulator-5555 shell df -h /data
          echo ""
          echo "=== ROOT STATUS ==="
          docker exec dockerify-android adb -s emulator-5554 shell "which su && echo 'su binary found' || echo 'su not in PATH, checking Magisk...'"
          docker exec dockerify-android adb -s emulator-5555 shell "ls /system/xbin/su 2>/dev/null || ls /system/bin/su 2>/dev/null || ls /sbin/su 2>/dev/null || echo 'Checking Magisk...'"
          docker exec dockerify-android adb -s emulator-5555 shell "magisk --version 2>/dev/null || echo 'Magisk not found in PATH'"

      # ────────────────────────────────────────────
      # PHASE 3: FRIDA SERVER INSTALLATION
      # ────────────────────────────────────────────
      - name: Install Frida Server
        run: |
          echo "=== INSTALLING FRIDA SERVER ==="
          FRIDA_VERSION="17.16.4"
          FRIDA_ARCH="x86_64"
          FRIDA_URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-server-${FRIDA_VERSION}-android-${FRIDA_ARCH}.xz"

          # Download Frida server
          echo "Downloading Frida server ${FRIDA_VERSION} for ${FRIDA_ARCH}..."
          wget -q --show-progress -O /tmp/frida-server.xz "${FRIDA_URL}"
          echo "Download complete. File size: $(ls -lh /tmp/frida-server.xz | awk '{print $5}')"

          # Decompress
          echo "Decompressing..."
          xz -d /tmp/frida-server.xz
          echo "Decompressed: $(ls -lh /tmp/frida-server | awk '{print $5}')"

          # Make executable
          chmod +x /tmp/frida-server

          # Push to device via ADB
          echo "Pushing Frida server to device..."
          docker exec dockerify-android adb -s emulator-5555 push /tmp/frida-server /data/local/tmp/frida-server
          docker exec dockerify-android adb -s emulator-5555 shell chmod 755 /data/local/tmp/frida-server
          echo "Frida server pushed to /data/local/tmp/"

          # Start Frida server
          echo "Starting Frida server..."
          docker exec dockerify-android adb -s emulator-5555 shell "nohup /data/local/tmp/frida-server -l 0.0.0.0 &"
          sleep 2

          # Verify Frida is running
          echo "Verifying Frida server..."
          docker exec dockerify-android adb -s emulator-5555 shell "ps aux | grep frida-server | grep -v grep" || true
          echo ""
          echo "=== FRIDA STATUS ==="
          echo "Frida server running on port 27042"
          docker exec dockerify-android adb -s emulator-5555 shell "ls -la /data/local/tmp/frida-server"

      # ────────────────────────────────────────────
      # PHASE 4: APP INSTALLATIONS (VERIFIED URLs)
      # ────────────────────────────────────────────
      - name: Download App APKs
        run: |
          mkdir -p /tmp/apks
          echo "=== DOWNLOADING APKs ==="

          # Termux v0.118.3 x86
          echo "[1/7] Termux..."
          wget -q --show-progress -O /tmp/apks/termux.apk \
            "https://github.com/termux/termux-app/releases/download/v0.118.3/termux-app_v0.118.3+x86.build.apk"
          ls -lh /tmp/apks/termux.apk

          # Termux:Boot
          echo "[2/7] Termux:Boot..."
          wget -q --show-progress -O /tmp/apks/termux-boot.apk \
            "https://github.com/termux/termux-app/releases/download/v0.118.3/termux-boot_v0.118.3.apk" 2>/dev/null || \
          wget -q --show-progress -O /tmp/apks/termux-boot.apk \
            "https://f-droid.org/repo/com.termux.boot_207.apk"
          ls -lh /tmp/apks/termux-boot.apk

          # Termux:API
          echo "[3/7] Termux:API..."
          wget -q --show-progress -O /tmp/apks/termux-api.apk \
            "https://github.com/termux/termux-app/releases/download/v0.118.3/termux-api_v0.118.3.apk" 2>/dev/null || \
          wget -q --show-progress -O /tmp/apks/termux-api.apk \
            "https://f-droid.org/repo/com.termux.api_207.apk"
          ls -lh /tmp/apks/termux-api.apk

          # F-Droid
          echo "[4/7] F-Droid..."
          wget -q --show-progress -O /tmp/apks/fdroid.apk \
            "https://f-droid.org/F-Droid.apk"
          ls -lh /tmp/apks/fdroid.apk

          # Firefox
          echo "[5/7] Firefox..."
          wget -q --show-progress -O /tmp/apks/firefox.apk \
            "https://download.mozilla.org/?product=fenix-latest-SSL&os=android&lang=en-US"
          ls -lh /tmp/apks/firefox.apk

          # Kiwi Browser
          echo "[6/7] Kiwi Browser..."
          wget -q --show-progress -O /tmp/apks/kiwi.apk \
            "https://github.com/kiwibrowser/browser-build/releases/download/m128.0.6613.163/arm64_kiwi_browser_128.0.6613.163.apk" 2>/dev/null || \
          wget -q --show-progress -O /tmp/apks/kiwi.apk \
            "https://github.com/kiwibrowser/src.next/releases/download/128.0.6613.163-release_202409100337/kiwi-browser-release-arm64.apk"
          ls -lh /tmp/apks/kiwi.apk

          # ScreenStream
          echo "[7/7] ScreenStream..."
          wget -q --show-progress -O /tmp/apks/screenstream.apk \
            "https://github.com/dkrivorotov/ScreenStream/releases/download/v4.4.2/ScreenStream_4.4.2_PlayStore.apk" 2>/dev/null || \
          wget -q --show-progress -O /tmp/apks/screenstream.apk \
            "https://f-droid.org/repo/info.dvkr.screenstream_4040200.apk"
          ls -lh /tmp/apks/screenstream.apk

          echo ""
          echo "=== APK DOWNLOAD SUMMARY ==="
          ls -lh /tmp/apks/

      - name: Install Apps
        run: |
          echo "=== INSTALLING APPS ==="
          for apk in /tmp/apks/*.apk; do
            name=$(basename "$apk")
            echo "Installing: ${name}..."
            # Copy APK into docker container first
            docker cp "$apk" dockerify-android:/tmp/
            container_name=$(basename "$apk")
            # Install via ADB
            docker exec dockerify-android adb -s emulator-5555 install /tmp/"$container_name" 2>&1 || \
              docker exec dockerify-android adb -s emulator-5555 install -r /tmp/"$container_name" 2>&1 || \
              echo "  Warning: Failed to install ${name}"
            docker exec dockerify-android rm -f /tmp/"$container_name"
          done
          echo ""
          echo "=== INSTALLED APPS ==="
          docker exec dockerify-android adb -s emulator-5555 shell pm list packages | grep -E "termux|fdroid|firefox|kiwi|screenstream"
          echo ""
          echo "=== ALL THIRD-PARTY APPS ==="
          docker exec dockerify-android adb -s emulator-5555 shell pm list packages -3

      - name: Configure App Permissions
        run: |
          echo "=== CONFIGURING PERMISSIONS ==="
          # Allow installing from unknown sources
          docker exec dockerify-android adb -s emulator-5555 shell settings put secure install_non_market_apps 1 2>/dev/null || true

          # Enable overlay for ScreenStream
          docker exec dockerify-android adb -s emulator-5555 shell appops set info.dvkr.screenstream SYSTEM_ALERT_WINDOW allow 2>/dev/null || true

          # Disable battery optimization for key apps
          docker exec dockerify-android adb -s emulator-5555 shell dumpsys deviceidle whitelist +com.termux 2>/dev/null || true
          docker exec dockerify-android adb -s emulator-5555 shell dumpsys deviceidle whitelist +info.dvkr.screenstream 2>/dev/null || true
          docker exec dockerify-android adb -s emulator-5555 shell dumpsys deviceidle whitelist +org.mozilla.firefox 2>/dev/null || true
          docker exec dockerify-android adb -s emulator-5555 shell dumpsys deviceidle whitelist +com.brave.browser 2>/dev/null || true

          echo "Permissions configured"

      # ────────────────────────────────────────────
      # PHASE 5: CONFIGURE SCREENSTREAM FOR WEBRTC
      # ────────────────────────────────────────────
      - name: Configure ScreenStream WebRTC
        run: |
          echo "=== CONFIGURING SCREENSTREAM ==="
          # Launch ScreenStream
          docker exec dockerify-android adb -s emulator-5555 shell am start -n info.dvkr.screenstream/.MainActivity 2>/dev/null || true
          sleep 3
          echo "ScreenStream launched. It will serve on port 8080 via WebRTC."
          echo "Access via: <your-browser-access-url>:8080"

      # ────────────────────────────────────────────
      # PHASE 6: SESSION KEEP-ALIVE & MONITORING
      # ────────────────────────────────────────────
      - name: Keep Session Alive
        run: |
          MAX_SECONDS=$((${{ github.event.inputs.session_hours }} * 3600))
          START_TIME=$(date +%s)
          echo "Session active. Max duration: ${{ github.event.inputs.session_hours }}h"
          echo "Your phone is accessible at: ${{ steps.expose.outputs.tunnel-url }}"
          echo ""
          while true; do
            ELAPSED=$(($(date +%s) - START_TIME))
            REMAINING=$((MAX_SECONDS - ELAPSED))
            if [ "${REMAINING}" -le 0 ]; then
              echo "TIME LIMIT REACHED (${MAX_SECONDS}s). Session ended."
              exit 0
            fi
            BOOT=$(docker exec dockerify-android adb -s emulator-5555 shell getprop sys.boot_completed 2>/dev/null || echo "0")
            HOURS=$((REMAINING / 3600))
            MINUTES=$(((REMAINING % 3600) / 60))
            if [ $((ELAPSED % 600)) -eq 0 ]; then
              echo "[$(date -u)] Status: boot=${BOOT} | remaining=${HOURS}h ${MINUTES}m"
              # Restart Frida if needed
              docker exec dockerify-android adb -s emulator-5555 shell "ps aux | grep frida-server | grep -v grep || nohup /data/local/tmp/frida-server -l 0.0.0.0 &" 2>/dev/null || true
            fi
            sleep 60
          done

  stop-phone:
    name: Stop Cloud Phone
    if: github.event.inputs.action == 'stop'
    runs-on: ubuntu-latest
    steps:
      - name: Stop All Services
        run: |
          echo "Stopping cloud phone..."
          docker stop scrcpy-web 2>/dev/null && docker rm scrcpy-web 2>/dev/null || true
          docker stop dockerify-android 2>/dev/null && docker rm dockerify-android 2>/dev/null || true
          docker system prune -f 2>/dev/null || true
          echo "All services stopped and cleaned up."
